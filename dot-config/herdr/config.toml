onboarding = false

[theme]
name = "terminal"

[keys]
navigate_workspace_down = "j"
navigate_workspace_up = "k"
navigate_pane_down = "down"
navigate_pane_up = "up"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
split_vertical = "prefix+backslash"
split_horizontal = "prefix+minus"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "willfish.herdr-navigator.left"
description = "navigate left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "willfish.herdr-navigator.down"
description = "navigate down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "willfish.herdr-navigator.up"
description = "navigate up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "willfish.herdr-navigator.right"
description = "navigate right"
